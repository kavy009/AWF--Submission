name: CI Pipeline

# Trigger pipeline on push and pull request targeting the main branch, or manual dispatch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Simulate intentional test failure for Practical 12 rubric demo'
        required: false
        type: boolean
        default: false

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend Automated Integration & Unit Tests
  # ----------------------------------------------------------------------------
  backend-test:
    name: Backend Tests (Express & Jest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (npm ci)
        working-directory: ./backend
        run: npm ci

      - name: Execute Automated Test Suite (Jest & Supertest)
        working-directory: ./backend
        env:
          NODE_ENV: test
          FAIL_TEST: ${{ inputs.simulate_failure || 'false' }}
        run: npm test

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Production Build & Asset Validation
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Build (Vite & React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Portfolio/package-lock.json

      - name: Install Frontend Dependencies (npm ci)
        working-directory: ./Portfolio
        run: npm ci

      - name: Compile Optimized Production Bundle (Vite)
        working-directory: ./Portfolio
        run: npm run build

  # ----------------------------------------------------------------------------
  # Job 3: Docker & Container Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validate:
    name: Docker Configuration Lint & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration Syntax
        run: docker compose config --quiet
